="cs" x="40" y="134" fill="#5b6478">41</text><text class="cs" x="76" y="134" fill="#16213a" xml:space="preserve">    if not cart.items:</text><text class="cs" x="40" y="154" fill="#5b6478">42</text><text class="cs" x="76" y="154" fill="#16213a" xml:space="preserve">        return Money(0)</text><text class="cs" x="40" y="174" fill="#5b6478">43</text><text class="cs" x="76" y="174" fill="#16213a" xml:space="preserve">    total = apply_discount(cart, coupon)</text><text class="cs" x="40" y="194" fill="#5b6478">44</text><text class="cs" x="76" y="194" fill="#16213a" xml:space="preserve">    return total + shipping(cart)</text><path d="M163 177h101" stroke="#2952cc" stroke-width="1.5" style="animation:k1 14.0s ease-out infinite;opacity:0.0"/></g><g style="animation:k3 14.0s ease-out infinite;opacity:0.0"><rect x="40" y="226" width="34" height="26" rx="6" fill="#e9edf3" stroke="#c4cbd7"/><text class="s" x="57" y="243" text-anchor="middle" fill="#16213a" font-weight="700">⌘</text><text class="s" x="84" y="243" fill="#5b6478">held: the name under the pointer is underlined</text></g><g style="animation:k4 14.0s ease-out infinite;opacity:0.0"><rect x="20" y="52" width="720" height="34" rx="9" fill="#f4f6fa" stroke="#dfe3eb"/><text class="s" x="36" y="73.0" fill="#5b6478">function</text><text class="c" x="106" y="73.0"><tspan fill="#5b6478">pricing.discounts.</tspan><tspan fill="#16213a" font-weight="700">apply_discount</tspan></text><rect x="20" y="92" width="720" height="98" rx="9" fill="#ffffff" stroke="#dfe3eb"/><rect x="21" y="102" width="718" height="22" fill="rgba(41,82,204,0.10)"/><text class="cs" x="40" y="117" fill="#5b6478">14</text><text class="cs" x="76" y="117"><tspan fill="#cf222e">def </tspan><tspan fill="#8250df">apply_discount</tspan><tspan fill="#16213a">(cart, coupon) -&gt; Money:</tspan></text><text class="cs" x="40" y="139" fill="#5b6478">15</text><text class="cs" x="76" y="139" fill="#16213a" xml:space="preserve">    rate = coupon.rate if coupon else 0</text><text class="cs" x="40" y="161" fill="#5b6478">16</text><text class="cs" x="76" y="161" fill="#16213a" xml:space="preserve">    return cart.total * (1 - rate)</text></g><g style="animation:k5 14.0s ease-out infinite;opacity:0.0"><rect x="300" y="132" width="420" height="104" rx="10" fill="#f4f6fa" stroke="#c4cbd7"/><text class="s" x="316" y="154" fill="#16213a" font-weight="700">Usages of apply_discount</text><text class="cs" x="316" y="180" fill="#2952cc">orders.py:43</text><text class="s" x="420" y="180" fill="#5b6478">in checkout</text><text class="cs" x="316" y="204" fill="#2952cc">api/carts.py:118</text><text class="s" x="448" y="204" fill="#5b6478">in CartView.preview</text><text class="cs" x="316" y="228" fill="#2952cc">tests/test_pricing.py:9</text><text class="s" x="500" y="228" fill="#5b6478">module level</text></g><g style="animation:k8 14.0s ease-in-out infinite;transform:translate(212px,170px)"><circle cx="1" cy="1" r="9" fill="none" stroke="#2952cc" stroke-width="2" style="animation:k6 14.0s ease-out infinite;opacity:0.0"/><circle cx="1" cy="1" r="9" fill="none" stroke="#2952cc" stroke-width="2" style="animation:k7 14.0s ease-out infinite;opacity:0.0"/><path d="M0 0L0 15L4 11.5L7 18L9.5 17L6.6 10.5L12 10.5Z" fill="#16213a" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/></g><path d="M20 310h720" stroke="#dfe3eb"/><text class="s" x="380.0" y="332" text-anchor="middle" fill="#16213a" style="animation:k9 14.0s ease-out infinite;opacity:1">Cmd+click (Ctrl+click) a name, as in your IDE</text><text class="s" x="380.0" y="332" text-anchor="middle" fill="#16213a" style="animation:k10 14.0s ease-out infinite;opacity:0.0">One definition: the review scrolls to it and highlights the line</text><text class="s" x="380.0" y="332" text-anchor="middle" fill="#16213a" style="animation:k11 14.0s ease-out infinite;opacity:0.0">On a definition, the same click lists its usages and where each one lives</text></svg>
