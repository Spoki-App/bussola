name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste private code, tokens or `gh auth token` output. For security issues, report privately as described in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version
      description: The installed version (`uv tool list`) or the commit you built
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it fail?
      options: [Install or startup, Units and diffs, Approvals, Comments, GitHub pull requests, Command line, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, ideally on a small public repository, and the error shown in the page or printed by `rtool serve`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, and `gh --version` for GitHub features
