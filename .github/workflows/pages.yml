name: Pages

on:
  push:
    branches: [main]
    paths:
      - redirect/**
      - frontend/public/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the link redirect page
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - run: node --test 'redirect/*.test.js'
      - name: Assemble the site
        run: |
          mkdir _site
          cp redirect/index.html redirect/*.js frontend/public/favicon.svg _site/
          rm _site/*.test.js
          cp redirect/index.html _site/404.html
      - uses: actions/configure-pages@v6
      - name: Archive the site
        run: tar -cvf "$RUNNER_TEMP/artifact.tar" -C _site .
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
