name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Check that the tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: uv build
      - name: Check that the wheel contains the UI and its licenses
        run: |
          unzip -l dist/*.whl | grep -q "static/index.html"
          unzip -l dist/*.whl | grep -q "static/THIRD_PARTY_LICENSES.md"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the changelog notes
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" 'index($0, heading) == 1 {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
